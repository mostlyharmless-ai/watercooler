# =============================================================================
# Watercooler Configuration
# =============================================================================
#
# Copy this file to:
#   - ~/.watercooler/config.toml      (user defaults)
#   - <project>/.watercooler/config.toml  (project overrides)
#
# Project settings override user settings on a per-key basis.
# Environment variables override both (see mapping below).
#
# All settings shown here are defaults - uncomment and modify as needed.
# =============================================================================

# Config schema version (do not change)
version = 1


# =============================================================================
# COMMON SETTINGS
# Shared between MCP server and Dashboard
# =============================================================================
[common]

# Templates directory (empty = use bundled templates)
# Env: WATERCOOLER_TEMPLATES
# templates_dir = ""


# =============================================================================
# MCP SERVER SETTINGS
# Configuration for watercooler-cloud MCP server
# =============================================================================
[mcp]

# ----- transport (execution-routing mode) -----
#
# NAMING CAVEAT: despite the key name, this setting does NOT control the
# agent↔mcp stdio pipe (which is always stdio). It picks where the local
# `watercooler-mcp` process executes tool calls. A clearer name would be
# "execution mode" or "routing" — we inherited "transport" from an earlier
# design. See docs/MCP-CLIENTS.md for the full discussion.
#
# Values:
# stdio:  local process — threads, baseline, local daemons, LLM + embedding.
#         Starts local FalkorDB via Docker. Premium tools only appear if
#         watercooler-cloud[memory] is installed (team-private; open-core
#         users see baseline tools only). No Railway dependency.
# hybrid: local threads + baseline + local daemons; premium capabilities
#         (memory query/observe/ingest, hosted coordinator daemons) proxy to
#         the remote endpoint. Local LLM + embedding services still start;
#         FalkorDB does NOT start locally (memory queries route to remote).
#         Needs [hosted].api_key in credentials.toml (dashboard-issued).
#         Observability splits by design: watercooler_health shows local
#         daemons, watercooler_daemon_status shows hosted daemons.
# proxy:  forwards ALL tool calls to a remote hosted MCP endpoint (no local
#         services start — the local process is a thin passthrough).
# http:   used by the hosted SERVER itself (Railway) — clients still use stdio.
#
# Agent client config (`claude mcp add --transport stdio ...`) stays stdio
# regardless of this value. Set url and api_key in credentials.toml for
# proxy/hybrid.
# Env: WATERCOOLER_MCP_TRANSPORT
# transport = "stdio"

# Remote MCP endpoint URL
# proxy:  points to /mcp (full remote surface)
# hybrid: points to /mcp/premium (premium capabilities only)
# Env: WATERCOOLER_MCP_URL
# url = "https://watercooler-cloud-production.up.railway.app/mcp/"

# Repository and branch for proxy/hybrid headers.
# The hosted endpoint needs these to scope operations. Falls back to
# local git discovery, but uvx subprocesses have no git context.
# Env: WATERCOOLER_CODE_REPO, WATERCOOLER_CODE_BRANCH
# proxy_repo = "org/repo"
# proxy_branch = "main"

# HTTP server settings (only used when transport = "http")
# Env: WATERCOOLER_MCP_HOST, WATERCOOLER_MCP_PORT
# host = "127.0.0.1"
# port = 3000

# Default agent name (when not detected from client)
# Env: WATERCOOLER_AGENT
# default_agent = "Agent"

# User tag appended to agent name. Watercooler wraps the value in parens
# automatically, so set the bare tag (e.g., "caleb") — the rendered author
# becomes "Codex (caleb)".
# Env: WATERCOOLER_AGENT_TAG
# agent_tag = ""

# Auto-create matching threads branches when code branch is new
# Env: WATERCOOLER_AUTO_BRANCH
# auto_branch = true

# Auto-provision (create) threads repos if missing
# Env: WATERCOOLER_AUTO_PROVISION
# auto_provision = true

# Explicit threads directory (empty = auto-discover from code repo)
# Env: WATERCOOLER_DIR
# threads_dir = ""

# Local-only mode (advanced): setting WATERCOOLER_ALLOW_LOCAL_ONLY=1 in
# the environment allows thread writes into a directory that is not
# backed by a GitHub repository. Threads written in this mode are NOT
# pushed to any remote — use for offline work or non-code project
# experiments only. No TOML equivalent; env-var only.
# See docs/TROUBLESHOOTING.md#local-only-mode for details.


# -----------------------------------------------------------------------------
# Capability Route Overrides (hybrid transport only)
# -----------------------------------------------------------------------------
# Per-capability routing for hybrid mode. Keys are capability ids; valid
# values are "auto", "local", "remote", or "disabled":
#   auto     — local if available, else remote if available, else disabled
#   local    — run in the local process
#   remote   — forward to the hosted endpoint
#   disabled — tool registered but refuses to execute
# Omitted capabilities inherit the hybrid defaults shown below (from
# HYBRID_DEFAULT_ROUTES in src/watercooler_mcp/capabilities.py). Uncomment
# any line below to override — the live section header makes single-line
# overrides safe.
[mcp.capability_routes]
# threads_core = "local"            # Thread CRUD operations
# thread_state_admin = "local"      # Thread deletion and archiving
# annotation_admin = "local"        # Annotation management
# baseline_search = "local"         # Keyword entry search (non-semantic)
# semantic_similarity = "remote"    # Semantic entry search + find_similar.
#                                   # ↑ Plan v20 Phase 8: in hybrid this runs
#                                   # against the hosted T1 FalkorDB HNSW index
#                                   # (<org>_<repo>_t1). Setting to "local" forces
#                                   # the JSONL fallback — useful for fully offline
#                                   # dev, but breaks the "no silent JSONL
#                                   # fallback" invariant of principle 10.
# baseline_maintenance = "local"    # Graph maintenance and repair
# federation_search = "local"       # Cross-repo search
# diagnostics = "local"             # Health checks and whoami
# memory_query = "remote"           # Smart query, entity edges, provenance
# memory_observe = "remote"         # Memory diagnostics and task status
# memory_ingest = "remote"          # Bulk indexing, episode ingestion
# daemon_observe = "remote"         # Daemon status and findings
#                                   # ↑ Keep on "remote" in hybrid for the clean
#                                   # split-surface contract: `watercooler_health`
#                                   # reports local daemons, `watercooler_daemon_status`
#                                   # reports hosted premium daemons.
#                                   # Setting this to "local" selects the LOCAL
#                                   # daemon tool surface — hosted daemons are then
#                                   # NOT surfaced through `watercooler_daemon_status`.
#                                   # See docs/MCP-CLIENTS.md § Daemon observability.
# daemon_control = "remote"         # Daemon lifecycle management
# memory_admin_graph = "disabled"   # Graph group clearing
# memory_admin_cluster = "disabled" # Cluster-level memory admin
# memory_migration = "disabled"     # Memory backend migration


# -----------------------------------------------------------------------------
# Agent-Specific Overrides
# Each agent platform can have custom settings
# -----------------------------------------------------------------------------
[mcp.agents.claude-code]
name = "Claude Code"
default_spec = "implementer-code"

[mcp.agents.cursor]
name = "Cursor"
default_spec = "implementer-code"

[mcp.agents.codex]
name = "Codex"
default_spec = "planner-architecture"

[mcp.agents.gemini]
name = "Gemini"
default_spec = "general-purpose"

# Add custom agents by copying the following 3 lines and removing the
# leading `# `. Uncomment the section header AND the keys together —
# uncommenting just the keys would redefine `name` in the preceding
# [mcp.agents.gemini] block.
# [mcp.agents.my-custom-agent]
# name = "My Agent"
# default_spec = "implementer-code"


# -----------------------------------------------------------------------------
# Git Settings
# Author info and SSH configuration for threads commits
# -----------------------------------------------------------------------------
[mcp.git]

# Git commit author (empty = use agent name)
# Env: WATERCOOLER_GIT_AUTHOR
# author = ""

# Git commit email
# Env: WATERCOOLER_GIT_EMAIL
# email = "mcp@watercooler.dev"

# Path to SSH private key (empty = use system default)
# Env: WATERCOOLER_GIT_SSH_KEY
# ssh_key = ""


# -----------------------------------------------------------------------------
# Sync Settings
# Git sync behavior and batching
# -----------------------------------------------------------------------------
[mcp.sync]

# Enable async git operations
# Env: WATERCOOLER_ASYNC_SYNC
# async_sync = true

# Seconds to batch commits before pushing
# Env: WATERCOOLER_BATCH_WINDOW
# batch_window = 5.0

# Maximum delay before forcing push (seconds)
# max_delay = 30.0

# Maximum entries per batch commit
# max_batch_size = 50

# Maximum retry attempts for failed operations
# Env: WATERCOOLER_SYNC_MAX_RETRIES
# max_retries = 5

# Maximum backoff delay in seconds
# Env: WATERCOOLER_SYNC_MAX_BACKOFF
# max_backoff = 300.0

# Background sync interval (seconds)
# Env: WATERCOOLER_SYNC_INTERVAL
# interval = 30.0

# Seconds before considering sync stale
# stale_threshold = 60.0


# -----------------------------------------------------------------------------
# Slack Integration Settings
# Env overrides: WATERCOOLER_SLACK_WEBHOOK, WATERCOOLER_SLACK_BOT_TOKEN,
#                WATERCOOLER_SLACK_APP_TOKEN, WATERCOOLER_SLACK_CHANNEL,
#                WATERCOOLER_SLACK_CHANNEL_PREFIX
# -----------------------------------------------------------------------------
[mcp.slack]

# Slack incoming webhook URL for notifications
# Env: WATERCOOLER_SLACK_WEBHOOK
# webhook_url = ""

# Slack bot token (xoxb-...) for rich interactions
# Env: WATERCOOLER_SLACK_BOT_TOKEN
# bot_token = ""

# Slack app token (xapp-...) for socket mode
# Env: WATERCOOLER_SLACK_APP_TOKEN
# app_token = ""

# Default Slack channel for notifications
# Env: WATERCOOLER_SLACK_CHANNEL
# default_channel = ""

# Prefix for auto-created channels (e.g., "wc-" → "wc-feature-auth")
# Env: WATERCOOLER_SLACK_CHANNEL_PREFIX
# channel_prefix = ""

# Auto-create a Slack channel for each new thread (requires bot_token)
# Default: true. Set to false to opt out.
# auto_create_channels = true

# Notification triggers (when to send Slack notifications)
# notify_on_say = true
# notify_on_ball_flip = true
# notify_on_status_change = true
# notify_on_handoff = true

# Minimum seconds between notifications for the same thread (rate limiter)
# min_notification_interval = 1.0


# -----------------------------------------------------------------------------
# HTTP Transport Settings
# Only used when transport = "http"
# Env overrides: WATERCOOLER_CORS_ORIGINS, WATERCOOLER_MAX_REQUEST_SIZE,
#                WATERCOOLER_REQUEST_TIMEOUT
# -----------------------------------------------------------------------------
[mcp.http]

# CORS allowed origins (comma-separated).
#   - empty string: allow all origins (no credentials mode)
#   - explicit list: allow credentials for those origins
# Env: WATERCOOLER_CORS_ORIGINS
# cors_origins = ""

# Maximum request body size in bytes (default 1MB)
# Env: WATERCOOLER_MAX_REQUEST_SIZE
# max_request_size = 1048576

# Request timeout in seconds
# Env: WATERCOOLER_REQUEST_TIMEOUT
# request_timeout = 30


# -----------------------------------------------------------------------------
# Cache Settings
# Env overrides: WATERCOOLER_CACHE_BACKEND, WATERCOOLER_CACHE_TTL,
#                WATERCOOLER_CACHE_MAX_ENTRIES, WATERCOOLER_CACHE_API_URL
# -----------------------------------------------------------------------------
[mcp.cache]

# Cache backend: "memory" (local) or "database" (hosted)
# Env: WATERCOOLER_CACHE_BACKEND
# backend = "memory"

# Default TTL in seconds
# Env: WATERCOOLER_CACHE_TTL
# default_ttl = 300.0

# Maximum entries in memory cache before LRU eviction
# Env: WATERCOOLER_CACHE_MAX_ENTRIES
# max_entries = 10000

# Database cache API URL (only used when backend = "database")
# Env: WATERCOOLER_CACHE_API_URL
# api_url = ""


# -----------------------------------------------------------------------------
# Hosted Service Settings
# Integration with watercooler.dev hosted services
# Note: API keys/secrets must be set via env vars for security
# -----------------------------------------------------------------------------
[mcp.hosted]

# Watercooler hosted API URL
# Env: WATERCOOLER_TOKEN_API_URL
# api_url = ""

# Hosted-mode auth secrets are env-only (never in TOML). Post Plan v5.1
# Sprint 4 (2026-05-01), the supported scheme is HMAC v3 via the per-key
# registry (env vars `WATERCOOLER_HMAC_KEY_<KEY_ID>_SECRET` plus
# `_TYPE`, `_SERVICE_IDENTITY`, `_DELEGATION`, `_REPOS`), with
# `WATERCOOLER_HMAC_REQUIRE_V3=enforce` as the production default. The
# legacy global `WATERCOOLER_INTERNAL_SECRET` was removed from the
# Railway production runtime; setting it has no effect on enforce-mode
# verification or on the Slack-sync path (which now reads exclusively
# from `WATERCOOLER_SLACK_SYNC_SECRET`). See
# docs/CONFIGURATION_HOSTED.md and docs/HMAC_CALLER_INVENTORY.md.


# -----------------------------------------------------------------------------
# Logging Settings
# -----------------------------------------------------------------------------
[mcp.logging]

# Log level: DEBUG, INFO, WARNING, ERROR
# Env: WATERCOOLER_LOG_LEVEL
# level = "INFO"

# Log directory (empty = ~/.watercooler/logs)
# Env: WATERCOOLER_LOG_DIR
# dir = ""

# Maximum log file size in bytes (default 10MB)
# Env: WATERCOOLER_LOG_MAX_BYTES
# max_bytes = 10485760

# Number of backup log files to keep
# Env: WATERCOOLER_LOG_BACKUP_COUNT
# backup_count = 5

# Disable file logging (stderr only)
# Env: WATERCOOLER_LOG_DISABLE_FILE
# disable_file = false


# -----------------------------------------------------------------------------
# Service Auto-Provisioning
# Controls automatic download of binaries and models
#
# SECURITY NOTE: Auto-downloading executables (llama_server) fetches binaries
# from GitHub releases. Checksums are verified when available. Set to false
# and install manually if this is a concern for your environment.
# -----------------------------------------------------------------------------
[mcp.service_provision]

# Auto-download GGUF models from HuggingFace when needed
# Env: WATERCOOLER_AUTO_PROVISION_MODELS
# Models are data files (not executables) - lower security risk
models = true

# Auto-download llama-server binary from GitHub releases when needed
# Env: WATERCOOLER_AUTO_PROVISION_LLAMA_SERVER
# Downloads executable from: https://github.com/ggml-org/llama.cpp/releases
# Checksum verification: Set WATERCOOLER_LLAMA_SERVER_VERIFY=strict for mandatory
llama_server = true


# -----------------------------------------------------------------------------
# Graph Settings
# Baseline graph construction with summaries and embeddings for semantic search
# -----------------------------------------------------------------------------
[mcp.graph]

# Generate LLM summaries for entries on write
# Requires LLM service (llama-server on port 8000)
# TOML-only — no env var override for this field
generate_summaries = true

# Generate embedding vectors for entries on write
# Requires embedding service (llama-server on port 8080)
# TOML-only — no env var override for this field
generate_embeddings = true

# Use extractive summaries only (no LLM calls, faster but less semantic)
# Env: WATERCOOLER_GRAPH_EXTRACTIVE
# prefer_extractive = false

# LLM service endpoint for summarization
# Env: BASELINE_GRAPH_API_BASE or LLM_API_BASE
# Default: llama-server on port 8000
# summarizer_api_base = "http://localhost:8000/v1"

# LLM model for summarization
# Env: BASELINE_GRAPH_MODEL or LLM_MODEL
# summarizer_model = "llama3.2:3b"

# Embedding service endpoint
# Env: EMBEDDING_API_BASE
# Default: llama-server on port 8080
# embedding_api_base = "http://localhost:8080/v1"

# Embedding model
# Env: EMBEDDING_MODEL
# embedding_model = "bge-m3"

# Check service availability before generation (skip gracefully if unavailable)
# When true, summary/embedding generation will only proceed if services respond
# TOML-only — no env var override for this field
auto_detect_services = true

# Auto-start LLM/embedding services if unavailable
# When true, will auto-start llama-server for localhost endpoints
# Env: WATERCOOLER_AUTO_START_SERVICES
# auto_start_services = false

# Embedding divergence threshold for thread summary regeneration
# When a new entry's embedding similarity to the previous entry falls below
# this threshold, it indicates a significant topic shift ("arc change") and
# triggers automatic thread summary regeneration.
#
# Values interpretation (threshold = similarity must fall BELOW to trigger):
#   1.0 = triggers on almost any change (maximum sensitivity)
#   0.6 = moderate threshold (default - recommended)
#   0.4 = only major topic shifts trigger (low sensitivity)
#   0.0 = never triggers based on divergence alone
#
# Set lower (0.4-0.5) to reduce summary churn, higher (0.7-0.8) for more
# responsive updates when topics shift within a thread.
# Env: WATERCOOLER_EMBEDDING_DIVERGENCE_THRESHOLD
# embedding_divergence_threshold = 0.6


# =============================================================================
# DAEMON SETTINGS
# Background daemons for continuous thread analysis.
# Enable globally, then opt-in per daemon. `enabled = false` is the default for
# most daemons (`sync_guard` is the exception — it defaults to `true`).
# Daemons marked [PREMIUM] ship only in hosted/premium deployments; their
# config schema is present in open-core so configs remain forward-compatible,
# but the daemon module itself is not installed on the open-core build.
#
# Per-daemon routing (PR #653):
#   Each premium daemon accepts a `route` field with values
#   "auto" (default) | "local" | "hosted" | "disabled".
#   "auto" resolves per transport: stdio/http → local, hybrid/proxy → hosted.
#
#   Observability consequence in hybrid mode:
#     - Default (all premium daemons on `route = "auto"`): `watercooler_health`
#       shows local-only daemons (e.g., sync_guard) and `watercooler_daemon_status`
#       shows the hosted premium set — clean split.
#     - Pinning any premium daemon to `route = "local"`: local daemon tools
#       mount to surface that pinned daemon, and the proxy daemon-tool mount
#       is SUPPRESSED. `watercooler_daemon_status` then reports the local
#       surface with an `authority_scope = "local_daemons_hybrid_override"`
#       label; hosted daemons are NOT surfaced through the tool in that
#       configuration. Merging local + hosted daemon views under one tool
#       is an explicitly deferred refactor (see
#       src/watercooler_mcp/server_factory.py:424-436 and docs/MCP-CLIENTS.md).
# =============================================================================
[mcp.daemons]

# Global on/off for all daemons (must be true for any daemon to run)
enabled = false

# --- Shared LLM (fallback for daemons that accept per-daemon LLM config) ---
# When a daemon's own [mcp.daemons.<name>.llm] is not set, some daemons
# (content_refiner, decision_extractor) fall through to this shared config.
# pulse_snapshot and pulse_report do NOT fall through — they require
# explicit per-daemon LLM config, by design.
[mcp.daemons.llm]
# api_base = ""        # LLM API base URL (empty = resolve via baseline graph config)
# model = ""           # LLM model name (empty = resolve via baseline graph config)
# timeout = 60.0       # request timeout in seconds
# max_tokens = 512     # max response tokens
# NOTE: api_key belongs in ~/.watercooler/credentials.toml, not here.

# --- Thread Auditor ---
# Checks thread hygiene: missing Status/Ball headers, missing entry IDs,
# missing graph summaries, stale threads, and directory classification.
# Zero LLM cost. Findings surface in watercooler_daemon_findings.
[mcp.daemons.thread_auditor]
# enabled = false              # opt-in (default: false)
# interval = 300.0             # seconds between audit scans
# check_missing_status = true  # flag threads with no Status: header
# check_missing_ball = true    # flag threads with no Ball: header
# check_missing_entry_ids = true  # flag entries with no Entry-ID comment
# check_missing_summaries = true  # flag entries/threads missing graph summaries
# check_stale_threads = true   # flag threads with no recent activity
# stale_days = 14              # days of inactivity before considered stale
# check_classification = true  # suggest directory reclassification
# max_findings_per_run = 200   # cap per tick to prevent runaway

# --- Sync Guard ---
# Proactive worktree parity checker — fetches periodically, auto-heals
# bounded cases (behind-only, dirty-derived), emits warnings for states
# that require manual sync_repair. Complements the reactive ensure_readable
# path so divergence doesn't compound silently between reads.
# NOTE: sync_guard is the one daemon enabled by default (when
# [mcp.daemons].enabled is true), since it protects data integrity.
[mcp.daemons.sync_guard]
# enabled = true               # ON by default (unlike other daemons)
# interval = 180.0             # seconds between parity checks

# --- Decision Detector ---
# Scores entries for decision-candidate likelihood using deterministic NLP.
# Zero LLM cost. Findings surface in watercooler_daemon_findings.
[mcp.daemons.decision_detector]
# enabled = false              # opt-in (default: false)
# interval = 300.0             # seconds between scans
# min_score = 2                # 2 = Medium+High (84.6% precision), 4 = High only
# max_findings_per_run = 200   # cap per tick to prevent runaway
# fuzzy_threshold = 85         # rapidfuzz threshold (0 = disabled)
# scan_closed_threads = true   # include closed threads
# exclude_agents = ["ExtractDecisionsDaemon"]  # agent prefixes to skip (feedback loop prevention)

# --- Decision Extractor ---
# LLM-powered extraction of structured Decision entries from detector findings.
# Consumes decision_candidate findings, applies 8-gate checklist via LLM,
# writes Decision entries back to threads. Completes the DTE pipeline:
# write → detect (deterministic NLP) → extract (LLM, writes Decisions).
[mcp.daemons.decision_extractor]
# enabled = false              # opt-in (default: false)
# interval = 1800.0            # 30 min between extraction cycles
# min_extraction_score = 4     # High tier only (score >= 4)
# max_candidates_per_tick = 3  # LLM cost control
# max_extractions_per_day = 20 # daily cap (resets at midnight UTC)
# max_body_chars = 4000        # max entry body chars sent to LLM
# min_confidence = 3           # minimum LLM confidence to emit Decision
# max_tick_duration = 300.0    # hard timeout per tick (seconds)
# max_extraction_attempts = 3     # per-entry cap on LLM-caused extraction failures
# max_write_failure_attempts = 5  # per-entry cap on infrastructure write failures

# Optional: daemon-specific LLM (overrides [mcp.daemons.llm] fallback)
[mcp.daemons.decision_extractor.llm]
# api_base = "http://localhost:8000/v1"
# model = "qwen3-30b-a3b"

# The four daemons above — thread_auditor, sync_guard, decision_detector,
# decision_extractor — are the full set that ships in the open-core build.
# Additional daemons (content scout, content refiner, project coordinator,
# coordinator refiner, pulse snapshot / pulse report, analysis snapshot,
# trend snapshot, t2 indexer) are closed-source and not present in
# this build. Their config schemas still parse (via the shared pydantic model)
# but no daemon registers to consume them, so adding those sections is a no-op.
#
# Two exceptions are shown below because their contracts affect operator
# behavior on the hosted stack:
#   - `project_coordinator`: `suppression_tags` affects annotation authoring.
#   - `coordinator_refiner`: L2 LLM synthesis of coordinator leads; knobs
#     shown so operators can tune cadence and LLM cost.
# Both sections are inert in open-core builds.

# --- Project Coordinator (hosted-only) ---
# Emits coordinator findings (stalled_open_loop, stalled_dropout, aware_burst,
# aware_role_concentration) across threads. Tag-based suppression quiets
# findings on threads carrying a matching annotation tag:
#   - stalled_* findings: severity downgraded from `warning` to `info`.
#   - aware_* findings: base `info` severity preserved; only the
#     `details.suppressed_by` marker is added.
# See docs/TOOLS-REFERENCE.md "Tag-based suppression" for details.
[mcp.daemons.project_coordinator]
# enabled = false                            # opt-in; hosted-only daemon
# interval = 600.0                           # seconds between scans
# max_findings_per_run = 200                 # cap per tick
# suppression_tags = ["parked", "wontfix", "deferred"]  # annotation tags that soft-suppress findings
# role_complement_enabled = false            # opt-in: detect threads missing a role active in a related thread
# role_complement_monitored_roles = ["tester", "critic"]  # subset of {planner,critic,implementer,tester,pm,scribe}
# role_complement_max_per_thread = 3         # max connect_role_complement findings per source thread per tick
# role_complement_pair_tag_prefix = "pair:"  # thread annotation tag prefix for explicit thread pairing
# role_complement_min_role_entries_in_related = 2  # min entries with the role in related thread B

# --- Coordinator Refiner (hosted-only, L2 LLM synthesis) ---
# Reads unacknowledged `coordinator_lead` findings produced by
# `project_coordinator` and emits `refined_coordinator_lead` findings under its
# own producer identity. Narrative-only output: 2-4 sentence `assessment` +
# 1-2 sentence `recommended_next_step`, plus verbatim passthrough of
# `suggested_action` and `t2_context` from the source lead. No clustering, no
# thread writes, no annotations.
[mcp.daemons.coordinator_refiner]
# enabled = false              # opt-in; hosted-only daemon
# interval = 600.0             # seconds between refinement ticks (>= 60)
# max_leads_per_tick = 5       # cap refinements per tick to bound LLM cost
# cursor_gc_interval = 24      # prune cursor of stale source-lead ids every N ticks
# llm_max_tokens = 512         # LLM response cap — narrative output is short
# llm_temperature = 0.3        # synthesis temperature — low; not a creative task
# llm_timeout_seconds = 30     # per-lead LLM call timeout


# =============================================================================
# DASHBOARD SETTINGS
# Configuration for watercooler-site dashboard
# =============================================================================
[dashboard]

# Pre-select this repo on dashboard load
# default_repo = ""

# Default branch for new selections
# default_branch = "main"

# Polling intervals (seconds) based on tab visibility
# poll_interval_active = 15    # Tab is focused
# poll_interval_moderate = 30  # Tab is visible but not focused
# poll_interval_idle = 60      # Tab is hidden/backgrounded

# UI preferences
# expand_threads_by_default = false
# show_closed_threads = false


# =============================================================================
# PROTOCOL VALIDATION
# Enforce Watercooler conventions and catch drift early
# =============================================================================
[validation]

# When to validate
# Env: WATERCOOLER_VALIDATE_ON_WRITE
# on_write = true
# on_commit = true

# Fail on violation (true = error, false = warn only)
# Env: WATERCOOLER_FAIL_ON_VIOLATION
# fail_on_violation = false

# What to validate
# check_commit_footers = true
# check_entry_format = true
# check_status_values = true


# -----------------------------------------------------------------------------
# Entry Format Validation
# -----------------------------------------------------------------------------
[validation.entry]

